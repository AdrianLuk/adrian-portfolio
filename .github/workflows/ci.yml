name: CI

# Pull requests, and main once they merge: a branch with a PR open isn't
# checked twice (once as a push, once as the PR).
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on a PR supersedes the run in progress. Every merge to main
# is still checked in full.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types, unit tests, then the production build.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - uses: ./.github/actions/build

  # The browser tests, alongside the checks.
  e2e:
    runs-on: ubuntu-latest
    # The suite runs 11 to 14 minutes, so a retry or two on a slow runner
    # would otherwise cancel it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/build

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Headless runs use Chromium's headless shell alone, kept between runs
      # until Playwright's version changes. Its system libraries are already
      # on the runner (it ships with Chrome), so nothing is installed with apt.
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell

      - name: Install the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: playwright-report/
          retention-days: 14
